<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한림제약 판매 대시보드 - 로그인 v3.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 8px;
        }

        .company-name {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .form-group input[type="email"]::placeholder {
            color: #999;
        }

        .btn-send {
            width: 100%;
            padding: 12px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-send:hover {
            background: #152a52;
        }

        .btn-send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .timer {
            text-align: center;
            color: #e74c3c;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .info-text {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 12px;
        }

        .code-input {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .code-input input {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            width: 100%;
        }

        .code-input input::-webkit-outer-spin-button,
        .code-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            color: #999;
            font-size: 11px;
        }

        .footer-info {
            margin: 5px 0;
        }
    
        .logo-img {
            max-height: 64px;
            max-width: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px;
        }
    </style>
</head>

    // ── 전역 변수 ─────────────────────────────────────────────────────

    // ── Step 1: 인증번호 전송 ─────────────────────────────────────────
    async function sendAuthCode() {
        const email = document.getElementById('email').value.trim().toLowerCase();

        if (!email) {
            showMessage('이메일을 입력해주세요', 'error');
            return;
        }
        if (!email.endsWith('@hanlim.com')) {
            showMessage('한림 이메일(@hanlim.com)만 가능합니다', 'error');
            return;
        }
        if (!employeeMap[email]) {
            showMessage('등록되지 않은 이메일입니다', 'error');
            return;
        }

        currentEmail = email;

        // ★ 관리자 이스터에그: 이메일 전송 없이 진행
        if (email === ADMIN_EMAIL.toLowerCase()) {
            showMessage('✅ 관리자 비밀번호를 입력해주세요', 'success');
            generatedCode = '__ADMIN__';  // 특수 마커
            document.getElementById('codeLabel').textContent = '관리자 비밀번호 입력';
            document.querySelectorAll('.code-input input').forEach(input => {
                input.value = '';
                input.type = 'password';
                input.inputMode = 'text';
                input.pattern = '.*';
                input.autocomplete = 'off';
            });
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            startAuthCodeTimer(600);
            setupCodeInputs(); document.querySelector('.code-input input').focus();
            return;
        }

        // 일반 사용자: 6자리 인증번호 생성
        document.getElementById('codeLabel').textContent = '인증번호 입력';
        document.querySelectorAll('.code-input input').forEach(input => {
            input.value = '';
            input.type = 'text';
            input.inputMode = 'numeric';
            input.pattern = '[0-9]*';
            input.autocomplete = 'one-time-code';
        });
        generatedCode = String(Math.floor(100000 + Math.random() * 900000));

        // EmailJS SDK v4 방식으로 전송
        try {
            await emailjs.send(
                EMAILJS_SERVICE_ID,
                EMAILJS_TEMPLATE_ID,
                {
                    to_email: email,
                    to_name: (employeeMap[email] && employeeMap[email].name) || email,
                    passcode: generatedCode,
                    message: generatedCode
                }
            );
            showMessage('✅ 인증번호가 ' + email + '로 전송되었습니다', 'success');
        } catch(err) {
            console.error('EmailJS 에러 전체:', JSON.stringify(err));
            const errMsg = err.text || err.message || JSON.stringify(err);
            showMessage('이메일 전송 실패: ' + errMsg, 'error');
            return;
        }

        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        startAuthCodeTimer(600);
        setupCodeInputs(); document.querySelector('.code-input input').focus();
    }

    // ── Step 2: 인증번호 확인 ──────────────────────────────────────────
    async function verifyAuthCode() {
        const codeInputs = document.querySelectorAll('.code-input input');
        const entered = Array.from(codeInputs).map(i => i.value).join('').trim();

        if (!entered) {
            showMessage('인증번호를 입력해주세요', 'error');
            return;
        }

        // ★ 관리자 이스터에그 검증
        if (currentEmail === ADMIN_EMAIL.toLowerCase()) {
            const savedPw = localStorage.getItem('admin_password') || 'hyuk';
            if (entered !== savedPw) {
                showMessage('❌ 비밀번호가 틀렸습니다', 'error');
                return;
            }
        } else {
            // 일반 사용자: 인증번호 비교
            if (entered.length !== 6) {
                showMessage('6자리 인증번호를 입력해주세요', 'error');
                return;
            }
            if (entered !== generatedCode) {
                showMessage('❌ 인증번호가 올바르지 않습니다', 'error');
                return;
            }
        }

        clearAuthCodeTimer();

        // 로그인 데이터 구성
        const empInfo = employeeMap[currentEmail] || {};
        const loginData = {
            email:      currentEmail,
            name:       empInfo.name     || '알 수 없음',
            dept:       empInfo.dept     || '',
            position:   empInfo.position || '',
            isAdmin:    empInfo.isAdmin  || false,
            loginTime:  new Date().toISOString(),
            expiresAt:  new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString()
        };

        // ★ localStorage 저장 (키: hanlim_login)
        localStorage.setItem('hanlim_login', JSON.stringify(loginData));

        // ★ Firebase Firestore 방문 로그 기록
        if (db) {
            try {
                await db.collection('visitLogs').add({
                    email:     loginData.email,
                    name:      loginData.name,
                    dept:      loginData.dept,
                    position:  loginData.position,
                    isAdmin:   loginData.isAdmin,
                    loginTime: firebase.firestore.FieldValue.serverTimestamp(),
                    loginTimeLocal: new Date().toLocaleString('ko-KR')
                });
            } catch(e) {
                console.warn('Firestore 로그 저장 실패:', e.message);
            }
        }

        showMessage('✅ 로그인 되었습니다', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }

    // ── 로그인 초기화 ──────────────────────────────────────────────────
    function resetLogin() {
        currentEmail  = '';
        generatedCode = '';
        clearAuthCodeTimer();
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('email').value = '';
        document.getElementById('codeLabel').textContent = '인증번호 입력';
        document.querySelectorAll('.code-input input').forEach(i => {
            i.value = '';
            i.type = 'text';
            i.inputMode = 'numeric';
            i.pattern = '[0-9]*';
            i.autocomplete = 'one-time-code';
        });
        document.getElementById('message').classList.add('hidden');
    }

    // ── 인증번호 입력박스 초기화 ──────────────────────────────────────
    function setupCodeInputs() {
        const inputs = document.querySelectorAll('.code-input input');
        inputs.forEach((input, idx) => {
            // 같은 이벤트가 중복 등록되지 않도록 새 노드로 교체
            const cloned = input.cloneNode(true);
            input.parentNode.replaceChild(cloned, input);
        });

        const freshInputs = document.querySelectorAll('.code-input input');
        freshInputs.forEach((input, idx) => {
            // 붙여넣기: 일반 사용자는 숫자 6자리, 관리자는 비밀번호 그대로
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const raw = (e.clipboardData || window.clipboardData).getData('text').trim();
                const isAdmin = currentEmail === ADMIN_EMAIL.toLowerCase();
                const pasted = isAdmin ? raw.slice(0, 6) : raw.replace(/\D/g, '').slice(0, 6);
                if (!pasted) return;
                freshInputs.forEach((inp, i) => { inp.value = pasted[i] || ''; });
                const lastIndex = Math.min(pasted.length, 6) - 1;
                if (lastIndex >= 0) freshInputs[lastIndex].focus();

                if (isAdmin) {
                    const savedPw = localStorage.getItem('admin_password') || 'hyuk';
                    if (pasted.length === savedPw.length) setTimeout(() => verifyAuthCode(), 100);
                } else if (pasted.length === 6) {
                    setTimeout(() => verifyAuthCode(), 100);
                }
            });

            input.addEventListener('input', function() {
                const isAdmin = currentEmail === ADMIN_EMAIL.toLowerCase();
                if (isAdmin) {
                    this.value = this.value.slice(-1);
                } else {
                    this.value = this.value.replace(/\D/g, '').slice(-1);
                }

                if (this.value.length === 1 && idx < 5) {
                    freshInputs[idx + 1].focus();
                }

                const all = Array.from(freshInputs).map(i => i.value).join('');
                if (isAdmin) {
                    const savedPw = localStorage.getItem('admin_password') || 'hyuk';
                    if (all.length === savedPw.length) setTimeout(() => verifyAuthCode(), 100);
                } else {
                    if (all.length === 6) setTimeout(() => verifyAuthCode(), 100);
                }
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    freshInputs[idx - 1].focus();
                }
                if (e.key === 'Enter') verifyAuthCode();
            });
        });
    }

        // ── 타이머 ────────────────────────────────────────────────────────
    function startAuthCodeTimer(seconds) {
        let remaining = seconds;
        updateTimerDisplay(remaining);
        authCodeTimer = setInterval(() => {
            remaining--;
            updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearAuthCodeTimer();
                showMessage('인증번호 유효시간 만료. 다시 입력해주세요', 'error');
                resetLogin();
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('timerText').textContent =
            String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function clearAuthCodeTimer() {
        if (authCodeTimer) { clearInterval(authCodeTimer); authCodeTimer = null; }
    }

    // ── 메시지 표시 ───────────────────────────────────────────────────
    function showMessage(text, type) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = 'message ' + type;
        el.classList.remove('hidden');
    }

    // ── 인증번호 입력란 자동 이동 ──────────────────────────────────────
    document.querySelectorAll('.code-input input').forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const val = e.target.value;
            const isAdmin = currentEmail === ADMIN_EMAIL.toLowerCase();
            if (val.length >= 1) {
                e.target.value = isAdmin ? val[val.length - 1] : val.replace(/\D/g, '').slice(-1);
                if (index < 5) document.querySelectorAll('.code-input input')[index + 1].focus();
            }
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                document.querySelectorAll('.code-input input')[index - 1].focus();
            }
            if (e.key === 'Enter') verifyAuthCode();
        });
    });

        ['oldPassword','newPassword','confirmPassword'].forEach(id => {
            document.getElementById(id).value = '';
        });
    }

    function changePassword() {
        const oldPw   = document.getElementById('oldPassword').value;
        const newPw   = document.getElementById('newPassword').value;
        const cfmPw   = document.getElementById('confirmPassword').value;
        const savedPw = localStorage.getItem('admin_password') || 'hyuk';

        if (oldPw !== savedPw)           { alert('❌ 현재 비밀번호가 틀렸습니다'); return; }
        if (!newPw || newPw.length < 4)  { alert('❌ 새 비밀번호는 4자 이상이어야 합니다'); return; }
        if (newPw.length > 6)            { alert('❌ 새 비밀번호는 6자 이하여야 합니다'); return; }
        if (newPw !== cfmPw)             { alert('❌ 비밀번호 확인이 일치하지 않습니다'); return; }

        localStorage.setItem('admin_password', newPw);
        alert('✅ 비밀번호가 변경되었습니다');
        closePasswordModal();
    }
    </script>
</body>
</html>
