<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한림제약 로그인</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }
        .company-name { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn { width: 100%; padding: 12px; background: #1e3c72; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #152a52; }
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }
        .message.error { background: #fee; color: #c33; border: 1px solid #fcc; display: block; }
        .message.success { background: #efe; color: #3c3; border: 1px solid #cfc; display: block; }
        .hidden { display: none !important; }
        .code-input { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 15px 0; }
        .code-input input { text-align: center; font-size: 18px; font-weight: bold; padding: 12px 6px; border: 1px solid #ddd; border-radius: 6px; }
        .timer { text-align: center; color: #e74c3c; font-weight: 600; font-size: 12px; margin-top: 8px; }
        .footer { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0; color: #999; font-size: 11px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h2 style="color: #1e3c72; margin-bottom: 5px;">한림제약</h2>
            <div class="company-name">판매 대시보드</div>
        </div>

        <div id="message" class="message"></div>

        <!-- Step 1: 이메일 입력 -->
        <div id="step1">
            <div class="form-group">
                <label>한림 이메일 주소</label>
                <input type="email" id="email" placeholder="name@hanlim.com" onkeydown="if(event.key==='Enter') sendCode()">
            </div>
            <button class="btn" onclick="sendCode()">인증번호 전송</button>
        </div>

        <!-- Step 2: 인증번호 입력 -->
        <div id="step2" class="hidden">
            <div class="form-group">
                <label>인증번호 6자리</label>
                <div class="code-input" id="codeInput">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                    <input type="text" maxlength="1" inputmode="numeric">
                </div>
                <div class="timer">남은 시간: <span id="timer">10:00</span></div>
            </div>
            <button class="btn" onclick="verifyCode()">로그인</button>
            <button class="btn" style="background: #999; margin-top: 5px;" onclick="goBack()">다시 입력</button>
        </div>

        <div class="footer">
            <div>📞 02-3489-6226</div>
            <div>© 2026 한림제약. All rights reserved.</div>
        </div>
    </div>

    <script>
    // ========== 설정 (필수!) ==========
    const EMAILJS_PUBLIC_KEY = '2xxUWMoBPKXPFjSIs';
    const EMAILJS_SERVICE_ID = 'service_k1do648';
    const EMAILJS_TEMPLATE_ID = 'gsrlptn';

    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyCZRpCO7ZRO_fR-3iRyI5WgeonoEKm4pgc",
        authDomain: "hanlim-target.firebaseapp.com",
        projectId: "hanlim-target",
        storageBucket: "hanlim-target.firebasestorage.app",
        messagingSenderId: "612689715001",
        appId: "1:612689715001:web:a6d914c07589ed479dd2e8"
    };

    const ADMIN_EMAIL = 'eui.hyuk@hanlim.com';
    // =====================================

    let db = null;
    let currentEmail = '';
    let generatedCode = '';
    let timerInterval = null;

    // Firebase 초기화
    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        console.log('✅ Firebase 초기화 성공');
    } catch(e) {
        console.warn('Firebase 초기화 실패:', e.message);
    }

    // EmailJS 초기화
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    console.log('✅ EmailJS 초기화 성공');

    // 메시지 표시
    function showMsg(text, type) {
        const el = document.getElementById('message');
        el.textContent = text;
        el.className = 'message ' + type;
        setTimeout(() => { el.className = 'message hidden'; }, 4000);
    }

    // 인증번호 전송
    async function sendCode() {
        const email = document.getElementById('email').value.toLowerCase().trim();

        if (!email) {
            showMsg('이메일을 입력해주세요', 'error');
            return;
        }
        if (!email.endsWith('@hanlim.com')) {
            showMsg('한림 이메일(@hanlim.com)만 가능합니다', 'error');
            return;
        }

        currentEmail = email;
        generatedCode = String(Math.floor(100000 + Math.random() * 900000));
        console.log('🔐 생성된 인증번호:', generatedCode);

        try {
            const result = await emailjs.send(
                EMAILJS_SERVICE_ID,
                EMAILJS_TEMPLATE_ID,
                {
                    to_email: email,
                    to_name: email.split('@')[0],
                    passcode: generatedCode,
                    message: '인증번호를 사용하세요'
                }
            );
            console.log('✅ EmailJS 전송 성공:', result);
            showMsg('✅ 인증번호가 메일로 전송되었습니다', 'success');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.querySelector('.code-input input').focus();
            startTimer();
            setupCodeInput();
        } catch(e) {
            console.error('❌ EmailJS 오류:', e);
            showMsg('이메일 전송 실패: ' + (e.text || e.message), 'error');
        }
    }

    // 코드 입력 처리
    function setupCodeInput() {
        const inputs = document.querySelectorAll('.code-input input');
        inputs.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && i < 5) {
                    inputs[i + 1].focus();
                }
                // 붙여넣기 감지
                if (e.target.value.length > 1) {
                    const vals = e.target.value.split('');
                    vals.forEach((v, idx) => {
                        if (i + idx < inputs.length) {
                            inputs[i + idx].value = v[0] || '';
                        }
                    });
                    inputs[Math.min(i + vals.length, 5)].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    inputs[i - 1].focus();
                }
                if (e.key === 'Enter') verifyCode();
            });
        });
    }

    // 인증번호 확인
    function verifyCode() {
        const inputs = document.querySelectorAll('.code-input input');
        const code = Array.from(inputs).map(i => i.value).join('');

        if (code.length !== 6) {
            showMsg('6자리를 모두 입력해주세요', 'error');
            return;
        }

        // 관리자 비밀번호 검증
        if (currentEmail === ADMIN_EMAIL.toLowerCase()) {
            const saved = localStorage.getItem('admin_password') || 'hyuk';
            if (code !== saved) {
                showMsg('❌ 비밀번호가 틀렸습니다', 'error');
                return;
            }
        } else {
            // 일반 사용자
            if (code !== generatedCode) {
                showMsg('❌ 인증번호가 틀렸습니다', 'error');
                return;
            }
        }

        clearInterval(timerInterval);
        localStorage.setItem('authToken', 'token_' + Date.now());
        localStorage.setItem('userEmail', currentEmail);
        localStorage.setItem('loginTime', Date.now());
        showMsg('✅ 로그인 성공!', 'success');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }

    // 타이머
    function startTimer() {
        let sec = 600;
        timerInterval = setInterval(() => {
            sec--;
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            document.getElementById('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
            if (sec <= 0) {
                clearInterval(timerInterval);
                goBack();
            }
        }, 1000);
    }

    function goBack() {
        document.getElementById('step1').classList.remove('hidden');
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('email').value = '';
        document.querySelectorAll('.code-input input').forEach(i => i.value = '');
        clearInterval(timerInterval);
    }
    </script>
</body>
</html>
